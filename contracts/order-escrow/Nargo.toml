[package]
name = "order_escrow_contract"
type = "contract"
authors = [""]
compiler_version = ">=0.18.0"

# Same sourcing rule as contracts/marketplace: all Aztec deps come from the
# aztec-packages checkout, because the aztec-standards token references aztec-nr
# by path inside it and mixing sources yields duplicate, non-unifying crates.
[dependencies]
aztec = { git = "https://github.com/AztecProtocol/aztec-packages", tag = "v5.0.1", directory = "noir-projects/aztec-nr/aztec" }
token = { git = "https://github.com/AztecProtocol/aztec-standards", tag = "v5.0.1", directory = "src/token_contract" }
market_protocol = { path = "../market-protocol" }
# Test fixture only: stands in for the arbitrating marketplace's public
# `order_states` map. Nothing in the contract itself references it.
test_arbiter = { path = "../test-arbiter" }
