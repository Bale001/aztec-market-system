# Manually-invoked desktop release: builds the Electron client for Windows,
# macOS, and Linux and publishes a GitHub release with the installers.
#
# The contract artifacts (TS bindings inputs + the dispute-proof circuit) are
# generated ONCE on Linux -- the aztec toolchain does not run on Windows --
# and shared to every OS builder; the artifacts themselves are plain JSON and
# platform-independent.

name: Release desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

env:
  AZTEC_VERSION: 5.0.1

jobs:
  contracts:
    name: Compile contracts (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Before the toolchain: the aztec CLI is a Node program, so it needs Node
      # on PATH to run at all. Same version the other jobs pin.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Aztec toolchain
        uses: ./.github/actions/setup-aztec
        with:
          version: ${{ env.AZTEC_VERSION }}

      - name: Compile + generate artifacts
        run: |
          bash scripts/compile.sh
          bash scripts/codegen.sh

      - uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: |
            packages/contract-bindings/src/artifacts
            packages/dispute-proof/src/artifacts
          if-no-files-found: error

  build:
    name: Build (${{ matrix.os }})
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Restore contract artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-artifacts
          path: packages

      # Workspace build scripts use POSIX commands (cp); run yarn scripts
      # through Git Bash on Windows.
      - name: Use bash for scripts (Windows)
        if: runner.os == 'Windows'
        run: yarn config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build packages
        run: yarn build

      - name: Package desktop app
        run: yarn workspace @market/desktop package
        env:
          # Unsigned builds everywhere for now (no signing identities in CI).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true

      - name: List installers
        run: ls -la installers

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: installers/*
